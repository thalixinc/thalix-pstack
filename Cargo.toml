[workspace]
members = ["crates/pstack-core", "crates/pstack-runtime", "cli/pstack"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/thalixinc/thalix-pstack"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
fs2 = "0.4"
hex = "0.4"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.9"
walkdir = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
